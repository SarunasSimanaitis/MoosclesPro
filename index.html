<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/moosclespro-mark.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="MoosclesPro: plan a workout, log every set and see how you're improving." />
  <title>MoosclesPro</title>
  <script>
    // Apply the saved theme before the first paint so dark mode never flashes white.
    try {
      var t = localStorage.getItem("mooscles-theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      if (t === "dark") document.documentElement.classList.add("dark");
      document.documentElement.style.colorScheme = t;
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
